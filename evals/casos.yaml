# 30 casos dorados.
#
#   herramientas_esperadas : las que debería usar, en cualquier orden
#   pasos_minimos          : con cuántas llamadas se resuelve bien
#   debe_contener          : fragmentos que la respuesta tiene que mencionar
#   debe_negarse           : true si la respuesta correcta es "no lo sé"
#   confirmar              : respuesta simulada del humano ante una escritura
#
# Estado de partida: odómetro en 68,400 km. Último cambio de aceite a 60,000 km.
# El manual lo pide cada 10,000 km, así que ya se pasó por 8,400.

# --- Consultas simples -------------------------------------------------------
- id: 1
  pregunta: ¿Cuántos kilómetros trae el coche?
  herramientas_esperadas: [kilometraje_actual]
  pasos_minimos: 1
  debe_contener: ["68"]

